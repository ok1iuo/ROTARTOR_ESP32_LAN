[platformio]
default_envs = ESP32LAN

[env:ESP32LAN]
platform = espressif32
board = esp32dev  ; Nebo specifická deska LaskaKit, pokud je podporována
framework = espidf
monitor_speed = 115200
extra_scripts = pre:scripts/version.py

; --- Důležité: Přidání závislostí nebo konfigurace ---
; Pokud používáte specifické knihovny nebo potřebujete upravit build flags
; build_flags =
; lib_deps =

; --- Nastavení pro menuconfig ---
; Umožňuje spustit 'pio run -t menuconfig' pro detailní nastavení ESP-IDF
board_build.embed_txtfiles = src/index.html ; web page, edit src/index.html
; 1.5 MB app (LVGL display); NVS stays at 0x9000 so settings survive the change
board_build.partitions = partitions_singleapp_large.csv

; Možná bude potřeba přidat cJSON explicitně, i když je součástí ESP-IDF
; Pokud by kompilace hlásila chybu s cJSON.h
; V ESP-IDF 5+ by měl být dostupný automaticky

; Host unit tests of the RS485 protocol helpers (lib/rotator_proto): pio test -e native
[env:native]
platform = native
test_build_src = no
